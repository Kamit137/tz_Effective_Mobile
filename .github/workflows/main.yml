name: Learn CI
on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: List files
        run: ls -la
      
      - name: Print environment
        run: env | sort
      
      - name: Check Go version
        run: go version
      
      - name: Run a fake test (always passes)
        run: echo "Tests passed"
